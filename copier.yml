_subdirectory: template

_templates_suffix: .jinja

application_name:
  type: str
  help: Name of the application

github_name:
  type: str
  help: Github user or organisation name

use_devcontainer:
  type: bool
  help: Include a VS Code dev container configuration?
  default: true

_tasks:
